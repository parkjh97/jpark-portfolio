<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>

  <!--
    J 설계 (중심선 기준):
    - 상단 가로 바: x 11~22, y 6 (가로 중심 = 16.5)
    - 세로 줄기:    x 16.5,  y 6 → 20.5 (완전 수직)
    - 하단 곡선:    (16.5, 20.5) → (10, 20.5)
                   제어점 양쪽 모두 y 27.5 → 완전 대칭 U 커브
  -->
  <line
    x1="11" y1="6"
    x2="22" y2="6"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 16.5 6 L 16.5 20.5 C 16.5 27.5 10 27.5 10 20.5"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
