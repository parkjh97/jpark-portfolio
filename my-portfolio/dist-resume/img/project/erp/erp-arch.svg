<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Pretendard','Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arrow-erp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="620" height="360" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">시스템 아키텍처 — QBicware ERP</text>

  <!-- Layer: Client -->
  <rect x="20" y="50" width="580" height="56" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="36" y="68" font-size="9" font-weight="700" fill="#7c3aed" letter-spacing="0.05em">CLIENT</text>
  <rect x="160" y="60" width="110" height="30" rx="6" fill="#7c3aed"/>
  <text x="215" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Browser / PWA</text>
  <rect x="350" y="60" width="110" height="30" rx="6" fill="#8b5cf6"/>
  <text x="405" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Web Push 수신</text>

  <!-- Arrow: Client -> Next.js -->
  <line x1="310" y1="106" x2="310" y2="125" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-erp)"/>
  <text x="322" y="118" font-size="9" fill="#64748b">HTTPS</text>

  <!-- Layer: Next.js App Router -->
  <rect x="20" y="128" width="580" height="90" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="36" y="146" font-size="9" font-weight="700" fill="#1d4ed8" letter-spacing="0.05em">NEXT.JS 14 APP ROUTER</text>
  <!-- Middleware -->
  <rect x="36" y="152" width="120" height="30" rx="6" fill="#1d4ed8"/>
  <text x="96" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">middleware.ts</text>
  <text x="96" y="178" text-anchor="middle" font-size="9" fill="#bfdbfe">인증 보호</text>
  <!-- Pages -->
  <rect x="180" y="152" width="120" height="30" rx="6" fill="#2563eb"/>
  <text x="240" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Pages (RSC)</text>
  <text x="240" y="178" text-anchor="middle" font-size="9" fill="#bfdbfe">30+ 페이지</text>
  <!-- API Routes -->
  <rect x="324" y="152" width="120" height="30" rx="6" fill="#3b82f6"/>
  <text x="384" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">API Routes</text>
  <text x="384" y="178" text-anchor="middle" font-size="9" fill="#bfdbfe">65개 엔드포인트</text>
  <!-- NextAuth -->
  <rect x="468" y="152" width="116" height="30" rx="6" fill="#1e40af"/>
  <text x="526" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">NextAuth.js</text>
  <text x="526" y="178" text-anchor="middle" font-size="9" fill="#bfdbfe">DB 세션 인증</text>

  <!-- Arrow: Next.js -> DB -->
  <line x1="310" y1="218" x2="310" y2="237" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-erp)"/>

  <!-- Layer: Database -->
  <rect x="20" y="240" width="340" height="56" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="36" y="258" font-size="9" font-weight="700" fill="#15803d" letter-spacing="0.05em">DATABASE</text>
  <rect x="80" y="252" width="220" height="30" rx="6" fill="#15803d"/>
  <text x="190" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">PostgreSQL</text>
  <text x="190" y="278" text-anchor="middle" font-size="9" fill="#bbf7d0">15+ 테이블 · DB 세션 · 결재 Function</text>

  <!-- Layer: External -->
  <rect x="380" y="240" width="220" height="56" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="396" y="258" font-size="9" font-weight="700" fill="#92400e" letter-spacing="0.05em">EXTERNAL</text>
  <rect x="390" y="252" width="96" height="30" rx="6" fill="#d97706"/>
  <text x="438" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Jandi Webhook</text>
  <text x="438" y="278" text-anchor="middle" font-size="9" fill="#fef3c7">결재 이벤트 알림</text>
  <rect x="496" y="252" width="96" height="30" rx="6" fill="#b45309"/>
  <text x="544" y="267" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Web Push</text>
  <text x="544" y="278" text-anchor="middle" font-size="9" fill="#fef3c7">VAPID 푸시 알림</text>

  <!-- Arrow from API Routes to External -->
  <line x1="444" y1="218" x2="490" y2="240" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arrow-erp)"/>

  <!-- Tech chips row -->
  <rect x="20" y="312" width="580" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="36" y="325" font-size="9" font-weight="600" fill="#64748b">STACK</text>
  <rect x="70" y="317" width="76" height="20" rx="4" fill="#e0e7ff"/>
  <text x="108" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">TypeScript</text>
  <rect x="152" y="317" width="60" height="20" rx="4" fill="#e0e7ff"/>
  <text x="182" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">Next.js 14</text>
  <rect x="218" y="317" width="68" height="20" rx="4" fill="#e0e7ff"/>
  <text x="252" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">Tailwind CSS</text>
  <rect x="292" y="317" width="56" height="20" rx="4" fill="#e0e7ff"/>
  <text x="320" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">Zustand</text>
  <rect x="354" y="317" width="76" height="20" rx="4" fill="#e0e7ff"/>
  <text x="392" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#4338ca">NextAuth.js</text>
  <rect x="436" y="317" width="76" height="20" rx="4" fill="#dcfce7"/>
  <text x="474" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">PostgreSQL</text>
  <rect x="518" y="317" width="72" height="20" rx="4" fill="#fef3c7"/>
  <text x="554" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">web-push</text>
</svg>
